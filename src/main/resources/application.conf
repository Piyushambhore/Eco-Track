ktor {
    deployment {
        host = "0.0.0.0"
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ com.ecotrack.ApplicationKt.module ]
    }
}

jwt {
    secret = "ecotrack-jwt-secret-change-in-production"
    secret = ${?JWT_SECRET}
    issuer = "ecotrack"
    issuer = ${?JWT_ISSUER}
    audience = "ecotrack-api"
    audience = ${?JWT_AUDIENCE}
    realm = "EcoTrack API"
    expirationSeconds = 3600
}

database {
    url = "jdbc:postgresql://localhost:5432/ecotrack"
    url = ${?DATABASE_URL}
    user = "ecotrack_dev"
    user = ${?DATABASE_USERNAME}
    password = "local_only_change_me"
    password = ${?DATABASE_PASSWORD}
    maxPoolSize = 10
}

cors {
    allowedOrigins = "http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500"
    allowedOrigins = ${?CORS_ALLOWED_ORIGINS}
}
